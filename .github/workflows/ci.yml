name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Syntax-check all shell scripts
        run: |
          find scripts hooks tests skills -type f -print0 |
            while IFS= read -r -d '' f; do
              if head -n 1 "$f" | grep -q 'bash'; then
                bash -n "$f"
              fi
            done

      - name: Shellcheck
        run: |
          # macOS runner images stopped bundling shellcheck; install rather
          # than silently skipping — a skipped check is a false guarantee.
          if ! command -v shellcheck >/dev/null 2>&1 && command -v brew >/dev/null 2>&1; then
            brew install shellcheck
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck unavailable and could not be installed" >&2
            exit 1
          fi
          find scripts hooks tests skills -type f -print0 |
            while IFS= read -r -d '' f; do
              if head -n 1 "$f" | grep -q 'bash'; then
                shellcheck -S warning "$f"
              fi
            done

      - name: Validate skills
        run: ./scripts/validate-skills

      - name: Validate docs
        run: ./scripts/validate-docs

      - name: Validate agents
        run: ./scripts/validate-agents

      - name: Validate plugin packaging
        run: ./scripts/validate-plugin

      - name: Validate evals
        run: ./scripts/validate-evals

      - name: Validate links
        run: ./scripts/validate-links

      - name: Tooling self-tests
        run: ./tests/run-tests.sh

      - name: Doctor smoke
        run: ./scripts/doctor
